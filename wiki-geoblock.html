<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мини-Вики: страны и столицы</title>
<style>
:root{--bg:#f8f9fa;--card:#fff;--tx:#202122;--mut:#54595d;--ln:#a2a9b1;--ac:#3366cc}
@media(prefers-color-scheme:dark){:root{--bg:#101418;--card:#1a2027;--tx:#eaecf0;--mut:#a2a9b1;--ln:#3a4350;--ac:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--ln);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font:700 20px Georgia,serif;margin:0;cursor:pointer}
header input{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font-size:15px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
main{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:16px}
h2{font:400 28px Georgia,serif;border-bottom:1px solid var(--ln);margin:0 0 12px;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.item{border:1px solid var(--ln);border-radius:8px;padding:10px;cursor:pointer;background:var(--card)}
.item:hover{border-color:var(--ac)}
.item b{display:block}.item span{color:var(--mut);font-size:14px}
table{border-collapse:collapse;width:100%;margin:8px 0}
td{border:1px solid var(--ln);padding:6px 10px}td:first-child{background:var(--bg);font-weight:600;width:40%}
a{color:var(--ac);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--ac);color:var(--ac);border-radius:16px;padding:4px 10px;font-size:14px;cursor:pointer}
.chat{max-height:340px;overflow:auto;display:grid;gap:8px;margin:8px 0}
.m{padding:8px 12px;border-radius:8px;white-space:pre-wrap}
.u{background:var(--ac);color:#fff;justify-self:end}.a{background:var(--bg);border:1px solid var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input[type=text],.row input[type=password]{flex:1;min-width:140px;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx)}
small{color:var(--mut)}

#geo{position:fixed;inset:0;z-index:9999;background:#0b0f14;color:#eaecf0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
#geo.on{display:flex}
#geo .gbox{max-width:420px}#geo h2{border:0;font-size:28px}#geo button{background:#3366cc;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:15px;cursor:pointer;margin:10px 0}
#geo small{display:block;color:#a2a9b1}
body.geo-checking>*:not(#geo):not(script),body.geo-locked>*:not(#geo):not(script){visibility:hidden!important}
</style>
</head>
<body class="geo-checking">
<div id="geo"><div class="gbox"><div style="font-size:54px">🚫</div><h2>Доступ ограничен</h2><p>Сайт недоступен для посетителей из вашей страны<span id="gc"></span>.</p><p>Чтобы зайти, включите <b>VPN</b> и нажмите кнопку ниже.</p><button onclick="geoCheck()">Я включил VPN — проверить</button><small id="gs"></small></div></div>
<header>
  <h1 onclick="home()">📖 Мини-Вики</h1>
  <input id="q" placeholder="Поиск страны или столицы…" oninput="home()">
</header>
<main>
  <div class="card" id="view"></div>
  <div class="card">
    <h2 style="font-size:22px">🤖 ИИ-помощник</h2>
    <div class="row">
      <input type="password" id="key" placeholder="API-ключ Google Gemini (AIza…)">
      <button onclick="saveKey()">Сохранить ключ</button><button class="ghost" onclick="testKey()">Проверить</button>
    </div>
    <small id="ks"></small>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="ghost" onclick="suggest()">💡 Подобрать промпты</button>
      <button class="ghost" onclick="auto()">⚡ Авто-режим</button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="row">
      <input type="text" id="ask" placeholder="Спроси про столицы и страны…" onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">Спросить</button>
    </div>
    <small>Ключ хранится только в вашем браузере. Без ключа помощник отвечает по базе вики попроще.</small>
  </div>
</main>
<script>
// [страна, столица, регион, население (млн), описание]
const D=[
["Россия","Москва","Европа/Азия",146,"Крупнейшая страна мира по площади, занимает более 17 млн км²."],
["Франция","Париж","Европа",68,"Страна в Западной Европе, известная культурой, кухней и Эйфелевой башней."],
["Германия","Берлин","Европа",84,"Крупнейшая экономика Европы, федеративная республика из 16 земель."],
["Италия","Рим","Европа",59,"Родина Римской империи и Возрождения, на Апеннинском полуострове."],
["Испания","Мадрид","Европа",48,"Страна на Пиренейском полуострове, известная фламенко и футболом."],
["Великобритания","Лондон","Европа",67,"Островное государство, состоящее из Англии, Шотландии, Уэльса и Северной Ирландии."],
["Польша","Варшава","Европа",37,"Страна в Центральной Европе на берегу Балтийского моря."],
["Украина","Киев","Европа",38,"Одна из крупнейших стран Европы, расположена в Восточной Европе."],
["Турция","Анкара","Европа/Азия",85,"Страна, расположенная на стыке Европы и Азии. Крупнейший город — Стамбул."],
["Казахстан","Астана","Азия",20,"Крупнейшая страна мира без выхода к океану."],
["Узбекистан","Ташкент","Азия",36,"Страна в Центральной Азии, родина Великого шёлкового пути."],
["Кыргызстан","Бишкек","Азия",7,"Горная страна в Центральной Азии с озером Иссык-Куль."],
["Китай","Пекин","Азия",1410,"Одна из древнейших цивилизаций и вторая по размеру экономика мира."],
["Япония","Токио","Азия",124,"Островное государство в Восточной Азии, известное технологиями и традициями."],
["Индия","Нью-Дели","Азия",1430,"Самая населённая страна мира, родина йоги и Тадж-Махала."],
["Южная Корея","Сеул","Азия",52,"Страна в Восточной Азии, мировой центр электроники и K-pop."],
["Таиланд","Бангкок","Азия",72,"Страна в Юго-Восточной Азии, известная пляжами и храмами."],
["Египет","Каир","Африка",112,"Страна с пирамидами Гизы и рекой Нил."],
["ЮАР","Претория","Африка",60,"Самая южная страна Африки; у неё три столицы: Претория, Кейптаун, Блумфонтейн."],
["Нигерия","Абуджа","Африка",224,"Самая населённая страна Африки."],
["США","Вашингтон","Северная Америка",335,"Федеративная республика из 50 штатов."],
["Канада","Оттава","Северная Америка",40,"Вторая по площади страна мира, с двумя официальными языками."],
["Мексика","Мехико","Северная Америка",128,"Страна с богатой культурой ацтеков и майя."],
["Бразилия","Бразилиа","Южная Америка",216,"Крупнейшая страна Южной Америки, родина карнавала."],
["Аргентина","Буэнос-Айрес","Южная Америка",46,"Страна танго и футбола, вытянутая вдоль Анд."],
["Австралия","Канберра","Океания",26,"Страна-континент. Крупнейший город — Сидней, но столица Канберра."]
];
const $=id=>document.getElementById(id);
let cur=null,hist=[];
function home(){cur=null;const t=$('q').value.toLowerCase().trim();
 const l=D.filter(c=>!t||c[0].toLowerCase().includes(t)||c[1].toLowerCase().includes(t));
 $('view').innerHTML='<h2>Страны и столицы</h2><div class="grid">'+(l.map(c=>`<div class="item" onclick="open_('${c[0]}')"><b>${c[0]}</b><span>Столица: ${c[1]}</span></div>`).join('')||'Ничего не найдено')+'</div>';chips();}
function open_(n){const c=D.find(x=>x[0]===n);cur=c;
 const same=D.filter(x=>x[2]===c[2]&&x[0]!==n);
 $('view').innerHTML=`<h2>${c[0]}</h2><p>${c[4]}</p><table><tr><td>Столица</td><td>${c[1]}</td></tr><tr><td>Регион</td><td>${c[2]}</td></tr><tr><td>Население</td><td>≈ ${c[3]} млн</td></tr></table><p><b>См. также:</b> ${same.map(x=>`<a onclick="open_('${x[0]}')">${x[0]}</a>`).join(', ')||'—'}</p><a onclick="$('q').value='';home()">← Все страны</a>`;
 scrollTo(0,0);chips();}
function chips(){const s=cur?[`Какая столица у страны ${cur[0]}?`,`Расскажи интересные факты о ${cur[0]}`,`Сравни ${cur[0]} с соседями`]:['Какая столица у Австралии?','Какая страна самая населённая?','Какие страны в Азии есть в вики?'];
 $('chips').innerHTML=s.map(x=>`<span class="chip" onclick="$('ask').value=this.textContent;send()">${x}</span>`).join('');}
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9;return d;}
function saveKey(){const k=$('key').value.trim();if(k){localStorage.setItem('akey',k);$('key').value='';}ks();}
async function testKey(){const k=localStorage.getItem('akey');if(!k){$('ks').textContent='Сначала вставьте ключ и нажмите «Сохранить»';return;}$('ks').textContent='Проверяю…';try{await gem(k,'Отвечай одним словом.','Скажи: работает');$('ks').textContent='✅ Ключ работает, вопросы идут в ваш ИИ';}catch(e){$('ks').textContent='❌ '+(e.name==='TypeError'?'Нет связи с Google API. Откройте файл на своём устройстве (не внутри claude.ai).':e.message);}}
function ks(){$('ks').textContent=localStorage.getItem('akey')?'✅ Ключ сохранён — вопросы идут в ваш ИИ (нажмите «Проверить»)':'Ключ не обязателен: ИИ встроен (при первом вопросе разрешите доступ)';}
const ctx=()=>'База вики (страна | столица | регион | население млн):\n'+D.map(c=>c.slice(0,4).join(' | ')).join('\n');
async function ai(sys,user){
 const k=localStorage.getItem('akey');let ge;
 if(k){try{return await gem(k,sys,user)}catch(e){ge=e.name==='TypeError'?new Error('Нет связи с Google API. Откройте файл на своём устройстве (не внутри claude.ai).'):e}}
 try{const s=window.claude&&await window.claude.use('sample');if(s){const r=await s(sys+'\n\nЗапрос: '+user,{cache:false});return r.text;}}catch(e){throw ge||e}
 if(ge)throw ge;return null;}
async function gem(k,sys,user){
 let le;for(const m of ['gemini-flash-latest','gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-lite-latest']){for(let t=0;t<2;t++){try{return await gem1(k,sys,user,m)}catch(e){le=e;if(e.name==='TypeError'||!/demand|overload|unavailable|quota|exhaust|try again|not found/i.test(e.message))throw e;await new Promise(r=>setTimeout(r,1200));}}}
 throw le;}
async function gem1(k,sys,user,m){
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:1000}})});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Ошибка API');
 return (j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');}
const SYS='Ты помощник мини-вики о странах и столицах. Отвечай по-русски, коротко, опираясь на базу ниже; если данных нет — скажи и ответь из общих знаний, пометив это.\n';
function local(q){const t=q.toLowerCase();
 for(const c of D){if(t.includes(c[0].toLowerCase()))return `${c[0]}: столица — ${c[1]}, регион — ${c[2]}, население ≈ ${c[3]} млн. ${c[4]}`;
  if(t.includes(c[1].toLowerCase()))return `${c[1]} — столица страны ${c[0]}.`;}
 if(t.includes('населён')){const m=[...D].sort((a,b)=>b[3]-a[3])[0];return `Самая населённая в базе: ${m[0]} (≈ ${m[3]} млн).`;}
 return 'В базе не нашёл ответа. Попробуйте ещё раз через минуту.';}
async function ask(q){const th=add('Думаю…','a');
 try{const a=await ai(SYS+ctx()+(cur?`\nСейчас открыта статья: ${cur[0]}.`:''),q);th.textContent=a??local(q);}
 catch(e){th.textContent='⚠️ '+e.message+'\n\nПростой ответ: '+local(q);}
 return th.textContent;}
async function send(){const q=$('ask').value.trim();if(!q)return;$('ask').value='';add(q,'u');await ask(q);}
async function suggest(){const th=add('Подбираю промпты…','a');
 try{const a=await ai('Придумай 5 коротких интересных вопросов для мини-вики о странах и столицах'+(cur?`, по теме «${cur[0]}»`:'')+'. Только список, по одному вопросу в строке, без нумерации.\n'+ctx(),'Дай вопросы');
  const l=(a||'').split('\n').map(s=>s.replace(/^[-•\d.\s]+/,'').trim()).filter(Boolean);
  th.textContent='Подобрал вопросы — нажмите на любой выше.';if(a)$('chips').innerHTML=l.map(x=>`<span class="chip" onclick="$('ask').value=this.textContent;send()">${x}</span>`).join('');
  else th.textContent='Нужен API-ключ для умного подбора промптов.';}
 catch(e){th.textContent='⚠️ '+e.message;}}
async function auto(){ const th=add('Авто-режим: придумываю вопросы…','a');
 try{const a=await ai('Придумай 3 разных вопроса по базе вики'+(cur?` про ${cur[0]}`:'')+'. Только вопросы, по одному в строке.\n'+ctx(),'Вопросы');
  th.remove();for(const q of a.split('\n').map(s=>s.replace(/^[-•\d.\s]+/,'').trim()).filter(Boolean).slice(0,3)){add(q,'u');await ask(q);}}
 catch(e){th.textContent='⚠️ '+e.message;}}
ks();home();
</script>
<script>
// GEOBLOCK: enabled=true включает блокировку; countries — коды стран (ISO), failOpen=true пускает, если страну определить не удалось
const GEOBLOCK={enabled:true,countries:['KG','KZ','RU'],failOpen:true};
async function geoCountry(){
 const src=[['https://api.country.is/',j=>j.country],['https://ipwho.is/',j=>j.country_code],['https://ipapi.co/json/',j=>j.country_code]];
 for(const [u,f] of src){try{const r=await fetch(u,{cache:'no-store'});const j=await r.json();const c=f(j);if(c)return String(c).toUpperCase();}catch(e){}}
 return null;}
async function geoCheck(){
 const b=document.body,g=document.getElementById('geo'),s=document.getElementById('gs');
 if(!GEOBLOCK.enabled){b.classList.remove('geo-checking','geo-locked');return;}
 if(s)s.textContent='Проверяю…';
 const c=await geoCountry();
 const blocked=c?GEOBLOCK.countries.includes(c):!GEOBLOCK.failOpen;
 g.classList.toggle('on',blocked);b.classList.remove('geo-checking');b.classList.toggle('geo-locked',blocked);
 if(blocked){document.getElementById('gc').textContent=c?' ('+c+')':'';if(s)s.textContent=c?'Определена страна: '+c:'Не удалось определить страну';}
}
geoCheck();
</script>
</body>
</html>
